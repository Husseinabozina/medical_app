name: Capture Figma showcase screens

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture_figma_screens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture selected Figma frames
        run: |
          mkdir -p docs/assets/figma
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const fileKey = 'jrf18b58l0rdFM4uTN5DEg';
          const fileName = 'Medical-App-UI-Kit-Health-Mobile-App-Tracker-Appointment-Mobile-App--Community-';
          const frames = [
            ['01-home', '2213-326'],
            ['02-specialties', '2068-756'],
            ['03-doctors', '2068-376'],
            ['04-doctor-profile', '2097-1242'],
            ['05-schedule', '2088-1073'],
            ['06-appointment-details', '2088-1187'],
            ['07-medical-record', '2110-221'],
            ['08-payment-summary', '2128-1624'],
          ];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
          });

          for (const [name, nodeId] of frames) {
            const page = await context.newPage();
            const url =
              `https://embed.figma.com/design/${fileKey}/${fileName}?embed-host=healthtrack-showcase&node-id=${nodeId}&footer=false&page-selector=false&viewport-controls=false&theme=light`;

            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(10000);

            await page.screenshot({
              path: `docs/assets/figma/${name}.png`,
              fullPage: false,
            });

            await page.close();
          }

          await browser.close();
          EOF
          node capture.mjs

      - name: Optimize screenshots
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          for path in Path("docs/assets/figma").glob("*.png"):
              image = Image.open(path).convert("RGB")
              output = path.with_suffix(".webp")
              image.save(output, "WEBP", quality=82, method=6)
              path.unlink()
          PY

      - name: Commit Figma screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/figma
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "docs: add Figma-sourced showcase screenshots"
          git push
