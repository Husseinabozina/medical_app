name: Bootstrap HealthTrack Source

permissions:
  contents: write

on:
  push:
    branches:
      - feature/healthtrack-30-screens
    paths:
      - '.bundle/**'
      - '.github/workflows/bootstrap_healthtrack.yml'

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/healthtrack-30-screens

      - name: Rebuild and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bundle/part-* | base64 -d > /tmp/healthtrack.tar.gz
          echo "9c4d6627813601b44008f24327726ce220fd61dea33c8243b36f8eda429298ef  /tmp/healthtrack.tar.gz" | sha256sum -c -
          tar --exclude='./.github/workflows/flutter_ci.yml' -xzf /tmp/healthtrack.tar.gz -C .
          rm -rf .bundle

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: implement HealthTrack 30-screen Flutter showcase"
          git push origin HEAD:feature/healthtrack-30-screens
