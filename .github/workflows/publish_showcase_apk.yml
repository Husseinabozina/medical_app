name: Publish Android showcase APK

on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/publish_showcase_apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android runner files
        run: flutter create . --platforms=android --project-name medical_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=BACKEND_MODE=mock

      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk healthtrack-demo.apk
          ls -lh healthtrack-demo.apk

      - name: Create or update showcase release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view showcase-latest >/dev/null 2>&1; then
            gh release upload showcase-latest healthtrack-demo.apk --clobber
          else
            gh release create showcase-latest healthtrack-demo.apk \
              --title "HealthTrack Android Showcase" \
              --notes "Installable Android portfolio build generated from the HealthTrack Flutter repository. This build uses the local demo data source and is intended to demonstrate the implemented app experience."
          fi
