name: medical_app
description: HealthTrack — a 30-screen Flutter medical portfolio showcase based on a Figma Community UI kit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
